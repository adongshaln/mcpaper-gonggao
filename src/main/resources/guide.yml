# 每项只在对应插件已启用时显示。修改后 /gonggao reload 即可生效。
# pages 内每段会按原版书页宽度自动换行、分页。
topics:
  - id: staff
    plugin: WitchHoe
    order: 10
    title: 法杖入门
    summary: 合成法杖、录入魔法、查看装备详情
    pages:
      - |-
        工作台同一竖列：
        上方：绿宝石
        中间：木棍
        下方：木棍

        合成一把空白法杖。
        未录入魔法时无法攻击。
      - |-
        将法杖放进附魔台，
        必定获得一种武器魔法。
        六种魔法互斥，
        同时只能保留一种。

        也能用附魔书和铁砧
        为法杖施加魔法。
      - |-
        法杖可附耐久、经验修补、
        锋利，并有三个刻印位置。
        普通锄头只作农具使用。

        在背包悬停物品，
        按住 Shift 展开详情，
        松开折叠。
      - |-
        不同魔法有各自的杖头。
        魔法等级越高，
        杖头略大，杖身刻线更多。

        主动施法成功消耗耐久，
        耐久附魔可降低消耗几率。
        分裂和持续跳伤不额外扣除。
  - id: spells
    plugin: WitchHoe
    order: 20
    title: 六种武器魔法
    summary: 引雷、枯萎、瘟疫、星星之杖、爆裂、回旋刃
    pages:
      - |-
        引雷：近战命中引来雷击，
        使目标昏厥一秒。

        枯萎：近战施加凋零，
        持续伤害并减速，可致死。

        瘟疫：施加中毒，可叠毒性，
        通常最低保留一点生命。
      - |-
        星星之杖：按下攻击键，
        向前发射一颗星星。
        按住不会自动连发。

        爆裂：近战命中后，
        火球从上方追踪目标，
        约两秒后造成范围伤害。
        爆炸不会破坏地形。
      - |-
        回旋刃：按住攻击键蓄力，
        松开投出，返回时追随你。
        一秒蓄满，距离最多翻倍，
        伤害不因蓄力增加。

        每命中一人，后续伤害衰减；
        返回时重新计算衰减。
      - |-
        星杖和回旋刃没有近战伤害。
        每种魔法的等级、伤害、
        冷却和刻印联动，
        都可在 Shift 详情中查看。

        新模型和蓄力功能，
        通过 Adongcraft 启动器
        自动获取客户端组件。
  - id: imprints
    plugin: WitchHoe
    order: 30
    title: 制作与使用刻印
    summary: 原石载体、附魔台录印、铁砧应用
    pages:
      - |-
        一个铁锭加一个金锭，
        任意摆放，合成原石载体。
        它是一块灰白色符文原石，
        但普通绿宝石不能代替。

        手持空白载体，
        右键满级附魔台录印。
      - |-
        需要十五个有效书架。
        三个选项完全相同，
        不显示刻印或等级预览。
        花费十五级经验，
        随机获得一条刻印。

        已刻印载体不能重新录印，
        普通书也不能获得刻印。
      - |-
        铁砧左边放装备，
        右边放已刻印载体，
        花费一级经验应用。

        法杖有三个刻印位置，
        每件防具有一个。
        同件装备不能重复刻印。
      - |-
        奥术分裂可追加目标，
        连锁反应在击杀后传播，
        屠夫能斩杀残血目标，
        黑死病让持续伤害更集中。

        刻印还有更多组合；
        悬停物品并按 Shift，
        查看适用部位与具体效果。
  - id: enhancement
    plugin: WitchHoe
    order: 35
    title: 淬炼炉与强化
    summary: 精英掉落强化石、金锭燃料、法杖增伤
    pages:
      - |-
        工作台中央放熔炉，
        周围八格各放一个金锭，
        合成淬炼炉。

        放置后右键打开，
        放入法杖、强化石和金锭，
        点击强化按钮。
      - |-
        每次消耗一颗强化石，
        和一个金锭。
        成功后法杖强化加一级，
        每级增加百分之五法术伤害。
        十级累计增加百分之五十。

        失败只扣材料，
        不降级，也不损坏法杖。
      - |-
        强化一级成功率百分之百，
        之后每级递减十个百分点，
        十级为百分之十。
        十一至十五级依次为
        百分之七、五、三、二、一。
        后续固定百分之一。

        界面会显示本次成功率。
      - |-
        玩家击杀精英后，
        每条词条提供百分之二十
        的强化石掉落概率。
        五条及以上必掉一颗。
        复活、转化时不重复结算。

        关闭界面会保留炉内物品，
        其他人也可以取用。
  - id: shields
    plugin: WitchHoe
    order: 40
    title: 防具与护盾
    summary: 防具刻印、白色护盾心和叠加规则
    pages:
      - |-
        静水：一段时间未受伤后，
        恢复独立护盾。
        蝉蜕：低血量时获得厚盾，
        随后快速衰减，冷却较长。

        白色护盾心显示在生命上方。
        两点护盾对应一颗心。
      - |-
        玻璃大炮：每件防具让
        承伤翻倍，输出增加一半。
        多件效果相乘。

        歌利亚巨人：增加十颗心，
        移动速度降低百分之二十。

        防具刻印在穿戴时生效。
      - |-
        溢流可把过量治疗存为盾，
        赊命把部分直接伤害分期，
        碎盾阵在护盾被打破时触发。

        装备不同刻印前，
        可用 Shift 比较完整说明。
  - id: world
    plugin: WitchHoe
    order: 50
    title: 世界等级
    summary: 末影龙推动世界从等级零升到一级
    pages:
      - |-
        世界初始等级为零。
        击杀末影龙后升到一级，
        全服会收到屏幕提示。

        所有维度共享等级。
        目前只开放零级和一级，
        重复击杀不会继续升级。
      - |-
        世界等级影响动物和怪物，
        不增加玩家的生命。

        零级普通生物：原生命。
        一级普通生物：两倍生命。

        精英额外加两倍基础生命，
        零级三倍，一级四倍。
      - |-
        世界升级后，精英更常出现。
        旧生物也会更新最大生命，
        保留当前生命比例。

        看到发光的怪物时，
        先查看它头顶的词条。
  - id: elites
    plugin: WitchHoe
    order: 60
    title: 精英怪物
    summary: 发光、头顶词条及十四种能力
    pages:
      - |-
        精英怪物永久发光，
        头顶显示自身的词条。
        同一只怪物不会重复词条。
        多词条精英出现概率更低。

        玩家击杀后经验翻倍，
        也有机会掉落已刻印载体。
      - |-
        击退抗性：无法被击退。
        若位于第三条或以后，
        变为受击向你突进的反击。

        死亡抗性：倒下五秒后复活。
        需在燃烧状态下击杀；
        倒下时也能用火焰终结。
      - |-
        跃袭：预警后跃向玩家。
        火径：经过处留下伤害区域。
        霜环：预警后使附近玩家减速。
        噬盾：攻击额外消耗护盾。
        迁跃：受远程攻击后传送。
        爆种：最终死亡后延迟爆发。
      - |-
        骷髅的专属词条：
        堕落骑士：死亡后变成
        持剑的精英凋零骷髅。
        专注射击：警戒后固定站位，
        每秒射击一次。
        逃跑计划：逃过一次致死伤害。
        骷髅骑士：骑马追击或后退，
        骷髅和马共享生命。
      - |-
        僵尸的专属词条：
        巨型僵尸：体型放大五倍，
        生命在精英基础上再乘五。
        全身都能被攻击命中。

        蜘蛛的专属词条：
        吐丝：近距离使玩家昏厥
        两秒，每只只触发一次。
  - id: death
    plugin: mcpaper-siwangbaoliu
    order: 70
    title: 死亡箱与经验
    summary: 死亡物品留箱、经验瓶、找回位置
    pages:
      - |-
        死亡掉落物会放进
        死亡地点附近的箱子。
        复活时会提示箱子坐标。
        拿空后，死亡箱自动消失。

        原有普通箱子不受影响。
        附近放不下箱子时，
        物品仍会掉在地上。
      - |-
        死亡经验存入特制经验瓶，
        和物品一同放在箱子里。
        取出特制瓶即可恢复经验。

        箱子带玩家名字，
        但其他玩家也能打开。
        漏斗不能从死亡箱抽取物品。
      - |-
        /zhuizong 死亡
        可追踪上一次死亡位置。

        如果死亡在另一维度，
        先按坐标进入对应世界，
        再使用追踪。
  - id: tracking
    plugin: mcpaper-zhuizong
    order: 80
    title: 玩家与地点追踪
    summary: 找队友、找重生点、找死亡位置
    pages:
      - |-
        /zhuizong 玩家名
        用紫色粒子指向该玩家。

        /zhuizong 自己的名字
        指向自己的床或重生锚；
        没有则指向世界出生点。
      - |-
        /zhuizong 死亡
        指向上一次死亡位置。

        再输入相同命令会停止。
        靠近目标后三格内结束。
        粒子沿直线指向目标，
        只有同一世界才能显示。
  - id: mark
    plugin: mcpaper-biaoji
    order: 90
    title: 队友标记
    summary: 沿准星标出方块、实体或方向
    pages:
      - |-
        /biaoji
        沿准星标记方块或生物，
        让其他玩家看到问号。

        看向空处时，
        标在前方约五十格。
        可以用来指路或提示目标。
      - |-
        默认快捷键为 G，
        可在游戏按键设置中修改。
        需要新版客户端组件。

        F 保留切换副手功能。
        使用命令也可以标记。
  - id: trees
    plugin: mcpaper-luodiguigen
    order: 100
    title: 砍树与补种
    summary: 砍完自然树后清理树叶并种回树苗
    pages:
      - |-
        自己砍完一棵树的原木后，
        它的树叶会立刻枯萎，
        并在原来最底部的树干处
        种回同类树苗。

        只处理自然树叶。
        相邻树木仍需要的树叶，
        会保留下来。
      - |-
        树叶枯萎时不产生掉落。
        补种位置被占用时，
        不会强行替换那个方块。

        只补种一株树苗；
        需要四株才能长大的树，
        其余树苗需自己补齐。
  - id: hud
    plugin: mcpaper-xinxikeshihua
    order: 110
    title: 目标信息与数字
    summary: 采集条件、生命、状态、伤害和治疗数字
    pages:
      - |-
        瞄准方块时，左上角显示
        方块名称、能否采集，
        以及需要的工具等级。

        瞄准生物时，显示
        名称、血量和状态效果。
        攻击和治疗还会弹出数字。
      - |-
        /xxksh toggle
        可开关自己的信息面板。

        面板直接显示在游戏内，
        无背景，紧凑排列。
        打开背包或隐藏界面时收起。

        启动器自动下载显示组件，
        游戏启动后不依赖悬浮窗。
  - id: stats
    plugin: mcpaper-stats-leaderboard
    order: 120
    title: 统计排行榜
    summary: 挖掘、移动、击杀与死亡统计
    pages:
      - |-
        按住 Tab，玩家列表上方
        会显示挖掘、移动、击杀
        和死亡的排行榜。

        /slb
        查看自己的统计。
      - |-
        /slb top blocks
        查看挖掘榜。
        /slb top distance
        查看移动榜。
        /slb top kills
        查看击杀榜。
        /slb top deaths
        查看死亡榜。
  - id: sorting
    plugin: ClickSorted
    order: 130
    title: 背包与箱子整理
    summary: 在容器空格按 F 整理，可锁定指定格子
    pages:
      - |-
        默认设置下，打开背包
        或箱子，把鼠标放在
        一个空格子上，按 F。
        对应区域会按物品整理。

        背包、箱子、木桶、
        潜影盒等都可以使用。
      - |-
        /clicksorted lock-slots
        可锁住不想参与整理的格子。

        容器界面内 F 用于整理，
        关闭界面后 F 切换副手。
        标记使用独立的 G 键。
