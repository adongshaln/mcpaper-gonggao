order: 60
announcements:
  - id: sort
    title: 整理
    pages:
      - |-
        打开背包或箱子，
        把鼠标放在一个空格子上，
        按 F（切换副手）。

        这一页会按物品种类排好。
        背包、箱子、木桶、
        潜影盒都可以。
      - |-
        不想被排走的格子，
        输入 /clicksorted lock-slots
        可以锁住。

        看完这一本后，
        点最后一页的
        「我已阅读」。
